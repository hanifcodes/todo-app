<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="Add a new task..." autocomplete="off" required />
      <button type="submit">Add</button>
    </form>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="done">Done</button>
    </div>

    <ul id="task-list"></ul>

    <p id="counter" class="counter"></p>
    <button id="clear-done" class="clear">Clear completed</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
